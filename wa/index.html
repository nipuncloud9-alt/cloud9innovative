<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<title>Cloud9 WhatsApp</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#f3f5f7;color:#17202a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:min(100%,440px);background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 35px rgba(0,0,0,.10)}
.logo{width:56px;height:56px;border-radius:16px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;margin-bottom:14px}
h1{margin:0;font-size:26px}
.sub{margin:6px 0 22px;color:#667085;font-size:14px}
label{display:block;font-weight:700;margin-bottom:8px;font-size:14px}
input{width:100%;height:54px;border:1px solid #d0d5dd;border-radius:14px;padding:0 15px;font-size:19px;outline:none}
input:focus{border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12)}
button{width:100%;height:56px;border:0;border-radius:14px;background:#16a34a;color:#fff;font-size:17px;font-weight:800;margin-top:14px;cursor:pointer}
button:active{transform:scale(.99)}
.preview{margin-top:20px;padding:16px;background:#f7faf7;border-radius:16px;border:1px solid #e3eee5}
.preview-title{font-size:13px;font-weight:800;margin-bottom:8px}
.preview-text{white-space:pre-line;font-size:13px;line-height:1.45;color:#344054}
.tip{margin-top:14px;font-size:12px;color:#667085;line-height:1.45}
.status{margin-top:10px;text-align:center;font-size:13px;font-weight:700;color:#167c3a;min-height:18px}
@media (max-width:420px){
 body{padding:10px;align-items:flex-start;padding-top:18px}
 .card{padding:20px;border-radius:20px}
 h1{font-size:24px}
}
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<main class="card">
  <div class="logo">C9</div>
  <h1>Cloud9 WhatsApp</h1>
  <div class="sub">Send your client thank-you message in seconds.</div>

  <label for="phone">Client WhatsApp Number</label>
  <input id="phone" type="tel" inputmode="numeric" autocomplete="tel"
         placeholder="Enter 10-digit number">

  <button onclick="send()">📲 SEND ON WHATSAPP</button>
  <div id="status" class="status"></div>

  <section class="preview">
    <div class="preview-title">Message Preview</div>
    <div class="preview-text" id="preview"></div>
  </section>

  <div class="tip">For Indian numbers, just enter the 10-digit mobile number. +91 is added automatically.</div>
</main>

<script>
const message =
"🙏 Thank you for giving us your valuable time.\n\n" +
"It was a pleasure connecting with you and understanding your requirements.\n\n" +
"At Cloud9 Innovative Communications, we assure you of quality, creativity and professional service.\n\n" +
"Our services:\n" +
"🎨 Creative Designing\n" +
"🖨️ Printing & Branding\n" +
"📱 Digital & Social Media Marketing\n" +
"📢 Advertising & Promotions\n\n" +
"We look forward to working with you. 🤝\n\n" +
"Regards,\n" +
"Team Cloud9";

document.getElementById("preview").textContent = message;

function getPhone(){
  let p=document.getElementById("phone").value.replace(/\D/g,"");
  if(p.length===10) p="91"+p;
  return p;
}

function send(){
  const phone=getPhone();
  if(!/^91[6-9]\d{9}$/.test(phone)){
    alert("Please enter a valid 10-digit Indian WhatsApp number.");
    return;
  }

  const url="https://api.whatsapp.com/send/?phone="+phone+"&text="+encodeURIComponent(message);
  document.getElementById("status").textContent="Opening WhatsApp…";
  window.location.href=url;
}

document.getElementById("phone").addEventListener("keydown",e=>{
  if(e.key==="Enter") send();
});
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("./service-worker.js");</script>
</body>
</html>
